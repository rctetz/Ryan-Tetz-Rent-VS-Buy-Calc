server_tokens off;
client_max_body_size 13m;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 20s;
send_timeout 30s;
limit_conn house_connections 16;
limit_req_status 429;
access_log off;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 35s;
proxy_send_timeout 20s;

location = /healthz {
    default_type application/json;
    return 200 '{"service":"house-alpha","status":"running"}';
}
location ~ ^/api/library/(login|register|password)$ {
    if (-f /var/lib/house-alpha-guard/paused) { return 503; }
    limit_req zone=house_auth burst=15 nodelay;
    proxy_pass http://127.0.0.1:8766;
}
location /api/library {
    if (-f /var/lib/house-alpha-guard/paused) { return 503; }
    limit_req zone=house_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8766;
}
location / {
    if (-f /var/lib/house-alpha-guard/paused) { return 503; }
    limit_req zone=house_api burst=30 nodelay;
    proxy_pass http://127.0.0.1:8765;
}
error_page 503 =503 /capacity-notice;
location = /capacity-notice {
    internal;
    default_type text/plain;
    return 503 'House Alpha is temporarily paused while we review capacity. Your saved library is preserved. Please try again later.';
}


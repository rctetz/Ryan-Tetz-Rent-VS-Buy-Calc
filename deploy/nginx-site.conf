server {
    listen 80 default_server;
    server_name 161.153.24.254 house.ryantetz.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://house.ryantetz.com$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name house.ryantetz.com;
    ssl_certificate /etc/letsencrypt/live/house-alpha-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/house-alpha-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HouseAlphaTLS:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/snippets/house-alpha-routes.conf;
}
